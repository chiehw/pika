name: Publish versioned Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare version and image name
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "DEFAULT_THEME_REF=$(tr -d '\r\n' < .github/default-theme.ref)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: pika-monitor/pika-default-theme
          ref: ${{ env.DEFAULT_THEME_REF }}
          path: pika-default-theme
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            pika-default-theme/package-lock.json
      - name: Test Go code
        run: go test ./...
      - name: Build binaries and frontend resources
        run: python3 scripts/build-container.py --version "$VERSION" --theme-dir pika-default-theme
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build local image for startup verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: pika:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image startup and bundled resources
        run: |
          docker run -d --name pika-image-smoke -p 127.0.0.1:18080:8080 \
            -v "$PWD/config.sqlite.yaml:/app/config.yaml:ro" pika:ci
          trap 'docker logs pika-image-smoke; docker rm -f pika-image-smoke' EXIT
          ready=false
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/api/auth/config > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          curl -fsS http://127.0.0.1:18080/admin/login | grep -q '<html'
          docker exec pika-image-smoke test -f /app/themes/default/pika-theme.json
          docker exec pika-image-smoke test -f /app/web/dist/index.html
          test "$(docker exec pika-image-smoke sh -c 'find /app/bin/agents -type f | wc -l')" -eq 8
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Publish amd64 and arm64 images
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo '## Docker image published' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
