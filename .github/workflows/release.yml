name: Build binaries and publish Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read pinned default theme
        run: echo "DEFAULT_THEME_REF=$(tr -d '\r\n' < .github/default-theme.ref)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: pika-monitor/pika-default-theme
          ref: ${{ env.DEFAULT_THEME_REF }}
          path: pika-default-theme
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Go tests
        run: go test ./...
      - name: Build frontends, binaries and packages
        run: python3 scripts/build-release.py --version "${GITHUB_REF_NAME}" --theme-dir pika-default-theme
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pika-${{ github.ref_name }}
          path: dist/*
      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          elif test -f "docs/releases/${GITHUB_REF_NAME}.md"; then
            gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "Pika ${GITHUB_REF_NAME}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "Pika ${GITHUB_REF_NAME}" --generate-notes
          fi
